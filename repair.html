<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voltline repair</title>
<meta name="theme-color" content="#0f172a">
<style>
  :root{--bg:#0f172a;--ink:#e2e8f0;--muted:#94a3b8;--ok:#34d399;--err:#f87171}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;padding:0 16px}
  main{max-width:420px;width:100%}
  h1{font-size:22px;margin:0 0 6px}
  p{color:var(--muted);margin:0 0 14px}
  ol{padding-left:20px;margin:0 0 16px}
  li{margin:4px 0}
  li.ok{color:var(--ok)} li.err{color:var(--err)}
  a.btn{display:inline-block;background:#0ea5e9;color:#fff;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:10px}
</style>
</head>
<body>
<main>
  <h1>Voltline · repair the update</h1>
  <p>This removes only the old copy of the app. Your points, photos, name and sync code stay on the phone.</p>
  <ol id="log"></ol>
  <a class="btn" id="go" href="./" hidden>Open Voltline</a>
</main>
<script>
(async function(){
  var log=document.getElementById('log');
  function step(t,cls){ var li=document.createElement('li'); li.textContent=t; if(cls) li.className=cls; log.appendChild(li); }
  if(!navigator.onLine){ step('No internet: connect to the network and open this page again.','err'); return; }
  try{
    // only the app-shell caches; the points live in IndexedDB and localStorage, which are not touched
    var ks=await caches.keys(), n=0;
    for(var i=0;i<ks.length;i++){ if(ks[i].indexOf('voltline')===0||ks[i].indexOf('lvwk')===0){ await caches.delete(ks[i]); n++; } }
    step('Old app copy removed ('+n+').','ok');
  }catch(e){ step('Could not clear the old copy: '+(e.message||e),'err'); }
  try{
    if('serviceWorker' in navigator){ var rs=await navigator.serviceWorker.getRegistrations(); for(var j=0;j<rs.length;j++) await rs[j].unregister(); }
    step('Old offline engine stopped.','ok');
  }catch(e){ step('Could not stop the old engine: '+(e.message||e),'err'); }
  try{
    // refresh the browser's own copy of the app files too
    var F=['./','index.html','app.js','sw.js','voltline-customers.js','voltline-transformers.js','voltline-villages.js','tracker.html','manifest.webmanifest'];
    await Promise.all(F.map(function(u){ return fetch(u,{cache:'reload'}).catch(function(){}); }));
    step('Latest files downloaded.','ok');
  }catch(e){}
  try{
    var r=await fetch('app.js?v='+Date.now(),{cache:'no-store'}), t=await r.text(), m=t.match(/BUILD = "([^"]+)"/);
    step('Latest version on the server: '+(m?m[1]:'unknown')+'.','ok');
  }catch(e){ step('Server not reached: '+(e.message||e),'err'); }
  step('Opening Voltline…');
  var go=document.getElementById('go'); go.href='./?fresh='+Date.now(); go.hidden=false;
  setTimeout(function(){ location.replace(go.href); },2500);
})();
</script>
</body>
</html>
